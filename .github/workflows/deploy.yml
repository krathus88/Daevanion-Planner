name: Deploy to GitHub Pages

on:
    push:
        branches: [main]
    workflow_dispatch:

permissions:
    contents: read
    pages: write
    id-token: write

concurrency:
    group: pages
    cancel-in-progress: true

# Unit tests and end-to-end tests (in Chromium and in Firefox) run side by
# side; the site is built and deployed only once all of them pass.
jobs:
    test:
        name: Unit tests
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7

            - uses: actions/setup-node@v7
              with:
                  node-version: 26
                  cache: npm

            - run: npm ci

            - name: Unit and component tests
              run: npm test

    e2e:
        name: E2E tests (${{ matrix.browser }})
        runs-on: ubuntu-latest
        # Playwright's image has the browsers and their system packages, so
        # nothing comes from apt (Ubuntu's mirrors were once unreachable from
        # the runners for hours). Its tag must match the Playwright version in
        # package-lock.json: bump both together. User 1001 is the runner's, so
        # the checkout stays writable and Firefox doesn't run as root.
        container:
            image: mcr.microsoft.com/playwright:v1.65.0-resolute
            options: --user 1001 --ipc=host
        strategy:
            # One browser failing still lets the other finish, to tell a
            # browser-specific failure from a broken page.
            fail-fast: false
            matrix:
                browser: [chromium, firefox]
        steps:
            - uses: actions/checkout@v7

            - uses: actions/setup-node@v7
              with:
                  node-version: 26
                  cache: npm

            - run: npm ci

            - name: End-to-end tests
              run: npx playwright test --project=${{ matrix.browser }}

            - name: Upload test report
              if: ${{ failure() }}
              uses: actions/upload-artifact@v7
              with:
                  name: playwright-report-${{ matrix.browser }}
                  path: |
                      playwright-report
                      test-results
                  if-no-files-found: ignore
                  retention-days: 7

    build:
        name: Build
        needs: [test, e2e]
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7

            - uses: actions/setup-node@v7
              with:
                  node-version: 26
                  cache: npm

            - run: npm ci

            - name: Build
              run: npm run build
              env:
                  # The site is served from https://<user>.github.io/<repo>/
                  BASE_PATH: /${{ github.event.repository.name }}/
                  # Link previews need absolute image/page URLs.
                  SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/

            # Pages has no SPA routing: serve the app for unknown paths so
            # links like /<repo>/planner/gladiator/zikel load on refresh.
            - name: Add SPA fallback
              run: cp dist/index.html dist/404.html

            - uses: actions/upload-pages-artifact@v5
              with:
                  path: dist

    deploy:
        name: Deploy
        needs: build
        runs-on: ubuntu-latest
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - id: deployment
              uses: actions/deploy-pages@v5

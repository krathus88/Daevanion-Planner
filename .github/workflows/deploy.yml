name: Deploy to GitHub Pages

on:
    push:
        branches: [main]
    workflow_dispatch:

permissions:
    contents: read
    pages: write
    id-token: write

concurrency:
    group: pages
    cancel-in-progress: true

# Unit and end-to-end tests run side by side; the site is built and deployed
# only once both pass.
jobs:
    test:
        name: Unit tests
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm

            - run: npm ci

            - name: Unit and component tests
              run: npm test

    e2e:
        name: E2E tests
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm

            - run: npm ci

            - name: Install Playwright browser
              run: npx playwright install --with-deps chromium

            - name: End-to-end tests
              run: npm run test:e2e

            - name: Upload test report
              if: ${{ failure() }}
              uses: actions/upload-artifact@v4
              with:
                  name: playwright-report
                  path: |
                      playwright-report
                      test-results
                  if-no-files-found: ignore
                  retention-days: 7

    build:
        name: Build
        needs: [test, e2e]
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm

            - run: npm ci

            - name: Build
              run: npm run build
              env:
                  # The site is served from https://<user>.github.io/<repo>/
                  BASE_PATH: /${{ github.event.repository.name }}/
                  # Link previews need absolute image/page URLs.
                  SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/

            # Pages has no SPA routing: serve the app for unknown paths so
            # links like /<repo>/planner/gladiator/zikel load on refresh.
            - name: Add SPA fallback
              run: cp dist/index.html dist/404.html

            - uses: actions/upload-pages-artifact@v3
              with:
                  path: dist

    deploy:
        name: Deploy
        needs: build
        runs-on: ubuntu-latest
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - id: deployment
              uses: actions/deploy-pages@v4
